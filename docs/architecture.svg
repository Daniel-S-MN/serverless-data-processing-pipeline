<svg width="680" height="276" viewBox="0 0 680 276" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Transaction pipeline architecture</title>
  <desc>A partner uploads a CSV to an S3 incoming prefix, which triggers a Lambda function that validates and transforms the data, writing output to an S3 processed prefix. The Lambda also sends alerts via SNS on rejections, routes unhandled failures to an SQS dead-letter queue after retries are exhausted, and writes execution logs to CloudWatch. All resources are provisioned by Terraform.</desc>

  <rect width="680" height="276" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Top row: main flow -->
  <g>
    <rect x="40" y="60" width="135" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="107" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#2c2c2a">Partner</text>
    <text x="107" y="98" text-anchor="middle" font-size="12" fill="#444441">Uploads CSV</text>
  </g>

  <g>
    <rect x="190" y="60" width="135" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
    <text x="257" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#4a1b0c">S3 incoming/</text>
    <text x="257" y="98" text-anchor="middle" font-size="12" fill="#712b13">Triggers Lambda</text>
  </g>

  <g>
    <rect x="340" y="60" width="135" height="56" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
    <text x="407" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#26215c">Lambda</text>
    <text x="407" y="98" text-anchor="middle" font-size="12" fill="#3c3489">Validates data</text>
  </g>

  <g>
    <rect x="490" y="60" width="135" height="56" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
    <text x="557" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#4a1b0c">S3 processed/</text>
    <text x="557" y="98" text-anchor="middle" font-size="12" fill="#712b13">Final output</text>
  </g>

  <line x1="175" y1="88" x2="188" y2="88" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="88" x2="338" y2="88" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="88" x2="488" y2="88" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Fan-out from Lambda to its three side effects -->
  <path d="M407 116L407 148L246 148L246 178" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <path d="M407 116L407 178" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <path d="M407 116L407 148L566 148L566 178" fill="none" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Bottom row: Lambda's side effects -->
  <g>
    <rect x="176" y="180" width="140" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
    <text x="246" y="200" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">SNS alerts</text>
    <text x="246" y="218" text-anchor="middle" font-size="12" fill="#633806">Email alerts</text>
  </g>

  <g>
    <rect x="336" y="180" width="140" height="56" rx="8" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
    <text x="406" y="200" text-anchor="middle" font-size="14" font-weight="500" fill="#501313">SQS DLQ</text>
    <text x="406" y="218" text-anchor="middle" font-size="12" fill="#791f1f">Retry exhausted</text>
  </g>

  <g>
    <rect x="496" y="180" width="140" height="56" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
    <text x="566" y="200" text-anchor="middle" font-size="14" font-weight="500" fill="#2c2c2a">CloudWatch</text>
    <text x="566" y="218" text-anchor="middle" font-size="12" fill="#444441">Logs &amp; metrics</text>
  </g>
</svg>
